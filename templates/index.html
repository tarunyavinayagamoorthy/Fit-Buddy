<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FitBuddy - AI Fitness Plan Generator</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: 'Roboto', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url('/static/images/gym_bg_1.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {

            width: 100%;
            max-width: 550px;

            padding: 35px;

            /*
             * Semi-transparent card.
             * Lower the last value (0.92) if you want
             * more of the background image to be visible.
             */
            background: rgba(20, 20, 20, 0.72);

            border-radius: 18px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.55);

            /*
             * Glass effect
             */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            animation: fadeIn 0.6s ease;
        }


        /* =====================================================
           ANIMATION
        ===================================================== */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================================
           HEADER
        ===================================================== */

        h1 {

            text-align: center;

            margin-top: 0;
            margin-bottom: 10px;

            font-size: 36px;

            font-weight: 700;

            letter-spacing: 1px;
        }


        .subtitle {

            text-align: center;

            color: #d1d5db;

            margin-top: 0;
            margin-bottom: 30px;

            line-height: 1.5;

            font-size: 15px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        label {

            display: block;

            margin-top: 16px;
            margin-bottom: 7px;

            font-weight: 500;

            color: #f3f4f6;
        }


        input,
        select {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 8px;

            font-size: 15px;

            font-family: inherit;

            background: rgba(255, 255, 255, 0.94);

            color: #111827;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        input:focus,
        select:focus {

            border-color: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.20);
        }


        input::placeholder {

            color: #6b7280;
        }


        /* =====================================================
           GENERATE BUTTON
        ===================================================== */

        .generate-button {

            width: 100%;

            margin-top: 27px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #22c55e;

            color: white;

            font-size: 16px;

            font-weight: 700;

            font-family: inherit;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                box-shadow 0.2s ease;
        }


        .generate-button:hover {

            opacity: 0.9;

            transform: translateY(-1px);

            box-shadow:
                0 6px 18px rgba(34, 197, 94, 0.30);
        }


        .generate-button:active {

            transform: translateY(0);
        }


        /* =====================================================
           EXISTING USER SECTION
        ===================================================== */

        .existing-user {

            margin-top: 30px;

            padding-top: 24px;

            border-top:
                1px solid rgba(255, 255, 255, 0.15);

            text-align: center;
        }


        .existing-user p {

            margin: 0 0 12px 0;

            color: #d1d5db;

            font-size: 14px;
        }


        .feedback-link {

            display: inline-block;

            padding: 10px 18px;

            border-radius: 8px;

            border:
                1px solid rgba(144, 205, 244, 0.7);

            color: #90cdf4;

            text-decoration: none;

            font-weight: 500;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .feedback-link:hover {

            background: rgba(144, 205, 244, 0.12);

            color: white;
        }


        /* =====================================================
           ADMIN SECTION
        ===================================================== */

        .admin-section {

            margin-top: 20px;

            text-align: center;
        }


        .admin-link {

            color: rgba(255, 255, 255, 0.55);

            font-size: 12px;

            text-decoration: none;
        }


        .admin-link:hover {

            color: #90cdf4;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {

                padding: 15px;

                background-attachment: scroll;
            }

            .container {

                padding: 25px 20px;

                border-radius: 15px;
            }

            h1 {

                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <h1>
        FitBuddy
    </h1>


    <p class="subtitle">
        AI-Powered Personalized Fitness Plan Generator
    </p>


    <!-- =====================================================
         NEW USER / PLAN GENERATION FORM
    ====================================================== -->

    <form
        action="/generate-workout"
        method="post"
    >


        <!-- NAME -->

        <label for="username">
            Name
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your name"
            required
        >


        <!-- USER ID -->

        <label for="user_id">
            User ID
        </label>

        <input
            type="text"
            id="user_id"
            name="user_id"
            placeholder="Create a unique User ID"
            required
        >


        <!-- AGE -->

        <label for="age">
            Age
        </label>

        <input
            type="number"
            id="age"
            name="age"
            min="1"
            max="120"
            placeholder="Enter your age"
            required
        >


        <!-- WEIGHT -->

        <label for="weight">
            Weight (kg)
        </label>

        <input
            type="number"
            id="weight"
            name="weight"
            step="0.1"
            min="1"
            placeholder="Enter your weight"
            required
        >


        <!-- GOAL -->

        <label for="goal">
            Fitness Goal
        </label>

        <select
            id="goal"
            name="goal"
            required
        >

            <option value="">
                Select Goal
            </option>

            <option value="weight loss">
                Weight Loss
            </option>

            <option value="muscle gain">
                Muscle Gain
            </option>

            <option value="general wellness">
                General Wellness
            </option>

            <option value="flexibility">
                Flexibility
            </option>

        </select>


        <!-- INTENSITY -->

        <label for="intensity">
            Workout Intensity
        </label>

        <select
            id="intensity"
            name="intensity"
            required
        >

            <option value="">
                Select Intensity
            </option>

            <option value="low">
                Low
            </option>

            <option value="medium">
                Medium
            </option>

            <option value="high">
                High
            </option>

        </select>


        <!-- GENERATE -->

        <button
            type="submit"
            class="generate-button"
        >
            Generate My 7-Day Plan
        </button>


    </form>


    <!-- =====================================================
         EXISTING USER
    ====================================================== -->

    <div class="existing-user">

        <p>
            Already have a FitBuddy plan?
        </p>

        <a
            href="/feedback"
            class="feedback-link"
        >
            Give Feedback & Update My Plan
        </a>

    </div>


    <!-- =====================================================
         ADMIN
         
         Keep this subtle. Later we will protect this route
         with admin authentication.
    ====================================================== -->

    <div class="admin-section">

        <a
            href="/admin/login"
            class="admin-link"
        >
            Admin Login
        </a>

    </div>


</div>


</body>

</html>
