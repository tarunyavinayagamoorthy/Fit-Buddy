<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FitBuddy - Admin Login</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Roboto', sans-serif;

            color: white;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url('/static/images/gym_bg_1.jpg');

            background-size: cover;
            background-position: center;
        }

        .container {
            width: 100%;
            max-width: 430px;

            padding: 35px;

            background: rgba(20, 20, 20, 0.72);

            border-radius: 18px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.55);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            background: rgba(127, 29, 29, 0.8);

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }

        .back {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #90cdf4;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        🔐 Admin Login
    </h1>

    <p class="subtitle">
        FitBuddy Administration
    </p>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form
        action="/admin/login"
        method="post"
    >

        <label for="username">
            Admin Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">
            Admin Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a
        href="/"
        class="back"
    >
        ← Back to FitBuddy
    </a>

</div>

</body>

</html>
