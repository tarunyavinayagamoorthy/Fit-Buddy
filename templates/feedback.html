<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - Update Your Plan</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: 'Roboto', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url('/static/images/gym_bg_2.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        .container {
            width: 100%;
            max-width: 550px;

            padding: 35px;

            background: rgba(20, 20, 20, 0.72);

            border-radius: 18px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.55);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: 500;
        }

        input,
        textarea {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            font-family: inherit;
            font-size: 15px;

            background: rgba(255, 255, 255, 0.95);

            color: #111827;

            outline: none;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.25);
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;
            border-radius: 9px;

            background: #22c55e;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #90cdf4;

            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        .info {
            margin-top: 20px;

            padding: 15px;

            background: rgba(255, 255, 255, 0.08);

            border-radius: 8px;

            color: #d1d5db;

            font-size: 14px;

            line-height: 1.5;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        FitBuddy
    </h1>

    <p class="subtitle">
        Update Your Personalized Workout Plan
    </p>

    <div class="info">
        Enter your User ID and tell FitBuddy what you would like
        to change in your current workout plan.
    </div>

    <form
        action="/submit-feedback"
        method="post"
    >

        <label for="user_id">
            User ID
        </label>

        <input
            type="text"
            id="user_id"
            name="user_id"
            placeholder="Enter your User ID"
            required
        >

        <label for="feedback">
            What would you like to change?
        </label>

        <textarea
            id="feedback"
            name="feedback"
            placeholder="Example: Reduce workout intensity, add more cardio, include yoga, reduce leg exercises..."
            required
        ></textarea>

        <button type="submit">
            Update My Workout Plan
        </button>

    </form>

    <a
        href="/"
        class="back"
    >
        ← Back to FitBuddy
    </a>

</div>

</body>

</html>
